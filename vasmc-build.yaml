includes:
  - "docs-src/*.vasm.md"
  - "docs-src/docs/*.vasm.md"
  - "packages/*/docs-src/README.vasm.md"
  - "skill-src/vasm-expert/vasmc-expert.vasm.md"

excludes:
  # extract-vasmc-knowledge 是临时 Prompt 文件，只在 update-vasmc-expert workflow 中手动触发
  - "skill-src/vasm-expert/extract-*.vasm.md"

output:
  dir: "./dist"

baseDir: "./"

# 交叉编译目标语种（按输出格式分别配置）
compile:
  doc:
    targetLangs:
      - "zh-CN"
  prompt:
    targetLangs:
      - "zh-CN"

security:
  # review: expose policy status in .vasmc/build-report.yaml.
  # enforce: block unsafe skill outputs from being updated when policy status is blocked.
  mode: review

ai:
  projectReview:
    mode: suggest
    include:
      - "README.md"
      - "HELP.md"
      - "DESIGN.md"
      - "docs/**/*.md"
      - ".changeset/config.json"
      - "package.json"
      - "packages/*/package.json"
      - "packages/*/CHANGELOG.md"
      - "vasmc-build.yaml"
      - "docs-src/**/*.vasm.md"
      - "packages/*/docs-src/**/*.vasm.md"
      - "skill-src/**/*.vasm.md"
      - "skill-src/**/*.md"

routing:
  # 顶层阅读文档：docs-src 是维护对象，docs/ 是 AI 和人读取的生成态入口
  - match: "docs-src/docs/*.vasm.md"
    dest: "./docs/"

  # package 自己的 README 源路由到对应 npm package 根目录。
  # package docs-src/fragments 只作为 import 片段，不直接生成 docs/。
  - match: "packages/core/docs-src/README.vasm.md"
    dest: "./packages/core/README.md"
  - match: "packages/cli/docs-src/README.vasm.md"
    dest: "./packages/cli/README.md"
  - match: "packages/console/docs-src/README.vasm.md"
    dest: "./packages/console/README.md"

  # 文档源文件直接路由到项目根目录
  - match: "docs-src/*.vasm.md"
    dest: "./"

  # vasmc-expert 主技能文件，编译产物命名为 SKILL.md（Antigravity skill 标准入口）
  - match: "skill-src/vasm-expert/vasmc-expert.vasm.md"
    dest: "./skills/vasm-expert/SKILL.md"

  # 其他 skill-src 文件（兜底路由，实际由 excludes 过滤）
  - match: "skill-src/vasm-expert/*.vasm.md"
    dest: "./skills/vasm-expert/"
